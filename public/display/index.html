<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auctioneer Display — Full House Horse Sale</title>
  <link rel="stylesheet" href="/display-static/display.css" />
</head>
<body>

<div class="display-root">

  <!-- HEADER BAR -->
  <div class="display-header">
    <div class="display-logo">
      <img src="/logo.webp" alt="Full House Horse Sale" style="height:48px;width:auto;" />
      <span>Auctioneer Display</span>
    </div>
    <div class="display-header-right">
      <span class="sale-date-label" id="sale-date-label"></span>
      <span class="status-pill" id="status-pill">Waiting</span>
    </div>
  </div>

  <!-- MAIN BOARD -->
  <div class="board" id="board">

    <!-- IDLE STATE -->
    <div class="board-idle" id="board-idle">
      <div class="idle-icon">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" width="72" height="72">
          <circle cx="32" cy="32" r="26"/>
          <path d="M32 20v12l7 4"/>
        </svg>
      </div>
      <h2>Waiting for Sale to Begin</h2>
      <p>The auctioneer will start the sale shortly.</p>
    </div>

    <!-- ACTIVE LOT -->
    <div class="board-active hidden" id="board-active">

      <div class="lot-left">
        <div class="lot-photo-container" id="lot-photo-container">
          <img id="lot-photo" src="" alt="" class="lot-photo hidden" />
          <div class="lot-photo-placeholder hidden" id="lot-photo-placeholder">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><rect x="4" y="4" width="40" height="40" rx="4"/><circle cx="16" cy="16" r="4"/><path d="M44 32l-12-12L4 44"/></svg>
          </div>
        </div>
        <div class="lot-name-block">
          <div class="lot-label">Current Lot</div>
          <div class="lot-name" id="lot-name">—</div>
          <div class="lot-details" id="lot-details"></div>
        </div>
      </div>

      <div class="lot-right">
        <div class="bid-block">
          <div class="bid-label">Current Bid</div>
          <div class="bid-amount" id="bid-amount">$0</div>
        </div>
        <div class="bidder-block">
          <div class="bid-label">High Bidder</div>
          <div class="bidder-value" id="bidder-value">—</div>
        </div>
        <div class="next-block">
          <div class="bid-label">Next Bid</div>
          <div class="next-value" id="next-value">—</div>
        </div>
      </div>

    </div>

  </div>

  <!-- ONLINE BID FLASH BANNER -->
  <div class="bid-flash-banner hidden" id="bid-flash-banner">
    <div class="flash-inner">
      <span class="flash-label">ONLINE BID</span>
      <span class="flash-amount" id="flash-amount">$0</span>
      <span class="flash-bidder" id="flash-bidder"></span>
    </div>
  </div>

  <!-- SOLD OVERLAY -->
  <div class="sold-overlay hidden" id="sold-overlay">
    <div class="sold-text">SOLD</div>
    <div class="sold-sub" id="sold-sub"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/display-static/display.js"></script>
</body>
</html>
